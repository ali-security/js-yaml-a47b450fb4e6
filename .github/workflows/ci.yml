name: CI

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      matrix:
        node-version: [ '23', '12', '14' ]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Pin npm registry time machine
      run: |
        npm config set registry https://time-machines-npm.sealsecurity.io/
        npm config set //time-machines-npm.sealsecurity.io/:_authToken=2025-11-12T15:18:03.524000Z

    - run: npm install

    - run: npm test

  package:

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 23
      uses: actions/setup-node@v4
      with:
        node-version: '23'

    - name: Pin npm registry time machine
      run: |
        npm config set registry https://time-machines-npm.sealsecurity.io/
        npm config set //time-machines-npm.sealsecurity.io/:_authToken=2025-11-12T15:18:03.524000Z

    - run: npm install

    # dist/ is committed and git-tracked at the release tag and `files` ships it
    # as-is, so a bare pack reproduces the published tgz; rebuilding it here would
    # only add rollup-version drift.
    - run: npm pack --ignore-scripts

    - uses: actions/upload-artifact@v4
      with:
        name: npm-tarball
        path: '*.tgz'
        if-no-files-found: error
